version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns: ['@playwright/*']
      qualidade:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'secretlint',
            '@secretlint/*',
            'husky',
            'lint-staged',
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
